# Public entry point for the proxy. type: LoadBalancer makes DigitalOcean
# create a load balancer with a public IP; Daniel to point the domain at it.
apiVersion: v1
kind: Service
metadata:
  name: proxy
  labels:
    app: proxy
spec:
  type: LoadBalancer
  # Route to pods carrying this label, i.e. the proxy Deployment's pods.
  selector:
    app: proxy
  ports:
    - name: http
      port: 80          # public side, on the load balancer
      targetPort: 8000  # uvicorn inside the container
