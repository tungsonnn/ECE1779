# The FastAPI proxy - Deployment keeps `replicas` copies running and replaces any pod that dies or fails its liveness probe.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels:
    app: proxy
spec:
  replicas: 2
  # Which pods this Deployment owns. Must match template.metadata.labels.
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          # CD (.github/workflows/ci.yml) swaps :latest for the commit ID on every merge to main.
          # A manual `kubectl apply` of this file gets :latest = the newest main build, never an old tag.
          image: registry.digitalocean.com/promptveil-registry/app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: doks
            - name: LOG_LEVEL
              value: INFO
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secret
                  key: LLM_API_KEY
                  optional: true   # pods still start without it; LLM calls then fail with 502
          # LLM_URL, LLM_MODEL, PRESIDIO_URL, ... (k8s/base/app-configmap.yaml)
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            # Reserved on the node by the scheduler.
            requests:
              cpu: 100m
              memory: 128Mi
            # Hard cap: exceeding it gets the pod OOMKilled, which protects the node's memory for Presidio and Postgres.
            limits:
              memory: 256Mi
          # Liveness
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: should this pod get traffic? Failing removes it from the Service without restarting it.
          readinessProbe:
            httpGet:
              path: /health/deep
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
