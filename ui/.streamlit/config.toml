[browser]
gatherUsageStats = false

[client]
# Never leak Python stack traces, paths, or internals to end users in production.
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
# Small cap since this UI accepts text prompts only, not file uploads.
maxUploadSize = 1

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
